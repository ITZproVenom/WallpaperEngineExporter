name: Publish Release
on:
  push:
    branches:
      - "release/**"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0             --target main             --title "LumaForge v1.0.0"             --notes "Clean-room LumaForge rebuild. Includes Steam OpenID authentication, Workshop discovery, local package inspection, and MP4 export pipeline."             --latest
