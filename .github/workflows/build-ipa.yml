name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes and targets
        run: |
          xcodebuild -list -project WallpaperEngineExporter.xcodeproj

      - name: Build for testing (simulator)
        run: |
          set -euo pipefail
          xcodebuild \
            -project WallpaperEngineExporter.xcodeproj \
            -scheme WallpaperEngineExporter \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        id: tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project WallpaperEngineExporter.xcodeproj \
            -scheme WallpaperEngineExporter \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned – no signing secrets on CI)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project WallpaperEngineExporter.xcodeproj \
            -scheme WallpaperEngineExporter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WallpaperEngineExporter.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Locate real .app and package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/WallpaperEngineExporter.xcarchive/Products/Applications/WallpaperEngineExporter.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Real .app not found at $APP_PATH"
            echo "Archive contents:"
            find build -type d -name "*.app" 2>/dev/null || true
            find build -type d 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "Found real application: $APP_PATH"
          ls -la "$APP_PATH"

          # Require executable
          EXECUTABLE="$APP_PATH/WallpaperEngineExporter"
          if [ ! -f "$EXECUTABLE" ]; then
            EXECUTABLE=$(find "$APP_PATH" -type f -perm +111 -maxdepth 1 | head -1 || true)
          fi
          if [ -z "$EXECUTABLE" ] || [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: No executable found inside the .app"
            find "$APP_PATH" -maxdepth 2 -type f
            exit 1
          fi
          echo "Executable: $EXECUTABLE"
          file "$EXECUTABLE"
          test -x "$EXECUTABLE" || chmod +x "$EXECUTABLE"

          # Require Info.plist
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          # Extract and verify CFBundleIdentifier
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist" 2>/dev/null || true)
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "ERROR: Could not read CFBundleIdentifier from Info.plist"
            exit 1
          fi
          echo "CFBundleIdentifier: $BUNDLE_ID"

          # Package genuine IPA
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WallpaperEngineExporter.ipa Payload
          rm -rf Payload

          echo "IPA created:"
          ls -lh WallpaperEngineExporter.ipa
          file WallpaperEngineExporter.ipa

      - name: Validate IPA (strict)
        id: validate
        run: |
          set -euo pipefail

          IPA=WallpaperEngineExporter.ipa

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA file does not exist"
            exit 1
          fi

          # Must be a valid zip
          if ! unzip -t "$IPA" > /dev/null; then
            echo "ERROR: IPA is not a valid ZIP archive"
            exit 1
          fi

          # Size check – genuine app should not be tiny
          SIZE=$(stat -f%z "$IPA" 2>/dev/null || stat -c%s "$IPA")
          echo "IPA size: $SIZE bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: IPA is suspiciously small ($SIZE bytes). Likely incomplete."
            exit 1
          fi

          echo "=== IPA contents (first 40 entries) ==="
          unzip -l "$IPA" | head -40

          # Required structure
          unzip -l "$IPA" | grep -q "Payload/.*\.app/" || {
            echo "ERROR: Missing Payload/*.app/"
            exit 1
          }

          # Extract for deeper checks
          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA" -d /tmp/ipa_check

          APP_IN_IPA=$(find /tmp/ipa_check/Payload -name "*.app" -type d | head -1)
          if [ -z "$APP_IN_IPA" ]; then
            echo "ERROR: No .app directory inside Payload"
            exit 1
          fi
          echo "App inside IPA: $APP_IN_IPA"

          if [ ! -f "$APP_IN_IPA/Info.plist" ]; then
            echo "ERROR: Info.plist missing inside IPA .app"
            exit 1
          fi

          # Executable must exist and be a Mach-O binary
          EXEC=$(find "$APP_IN_IPA" -type f -perm +111 -maxdepth 1 | head -1 || true)
          if [ -z "$EXEC" ]; then
            EXEC="$APP_IN_IPA/WallpaperEngineExporter"
          fi
          if [ ! -f "$EXEC" ]; then
            echo "ERROR: Executable missing inside IPA .app"
            find "$APP_IN_IPA" -maxdepth 2 -type f
            exit 1
          fi
          echo "Executable inside IPA: $EXEC"
          file "$EXEC"
          file "$EXEC" | grep -qi "Mach-O\|executable" || {
            echo "ERROR: Executable does not appear to be a Mach-O binary"
            exit 1
          }

          # Bundle identifier
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_IN_IPA/Info.plist" 2>/dev/null \
            || plutil -extract CFBundleIdentifier raw "$APP_IN_IPA/Info.plist" 2>/dev/null \
            || echo "")
          if [ -z "$BID" ]; then
            echo "ERROR: CFBundleIdentifier could not be read from IPA Info.plist"
            exit 1
          fi
          echo "Validated CFBundleIdentifier: $BID"

          # Version from built app
          SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_IN_IPA/Info.plist" 2>/dev/null \
            || plutil -extract CFBundleShortVersionString raw "$APP_IN_IPA/Info.plist" 2>/dev/null \
            || echo "1.0.0")
          BUILD_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_IN_IPA/Info.plist" 2>/dev/null \
            || plutil -extract CFBundleVersion raw "$APP_IN_IPA/Info.plist" 2>/dev/null \
            || echo "1")

          SHA256=$(shasum -a 256 "$IPA" | awk '{print $1}')
          HUMAN_SIZE=$(ls -lh "$IPA" | awk '{print $5}')

          echo "=== IPA VALIDATION PASSED ==="
          echo "Size: $HUMAN_SIZE ($SIZE bytes)"
          echo "SHA-256: $SHA256"
          echo "Bundle ID: $BID"
          echo "Version: $SHORT_VER build $BUILD_VER"
          echo "Note: This IPA is UNSIGNED (CODE_SIGNING_ALLOWED=NO). Suitable for CI validation only."

          # Persist for later steps
          echo "ipa_size_bytes=$SIZE" >> "$GITHUB_OUTPUT"
          echo "ipa_size_human=$HUMAN_SIZE" >> "$GITHUB_OUTPUT"
          echo "ipa_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BID" >> "$GITHUB_OUTPUT"
          echo "short_version=$SHORT_VER" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VER" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${SHORT_VER}-build${BUILD_VER}" >> "$GITHUB_OUTPUT"

          rm -rf /tmp/ipa_check

      - name: Upload IPA artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEngineExporter-IPA-unsigned
          path: WallpaperEngineExporter.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Pre-release safety re-check
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IPA=WallpaperEngineExporter.ipa

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA missing before release"
            exit 1
          fi

          SIZE=$(stat -f%z "$IPA" 2>/dev/null || stat -c%s "$IPA")
          EXPECTED_SIZE="${{ steps.validate.outputs.ipa_size_bytes }}"
          if [ "$SIZE" != "$EXPECTED_SIZE" ]; then
            echo "ERROR: IPA size changed after validation ($SIZE vs $EXPECTED_SIZE)"
            exit 1
          fi

          SHA=$(shasum -a 256 "$IPA" | awk '{print $1}')
          EXPECTED_SHA="${{ steps.validate.outputs.ipa_sha256 }}"
          if [ "$SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: IPA SHA-256 mismatch after validation"
            echo "Current:  $SHA"
            echo "Expected: $EXPECTED_SHA"
            exit 1
          fi

          if ! unzip -t "$IPA" > /dev/null; then
            echo "ERROR: IPA is not a valid ZIP before release"
            exit 1
          fi

          unzip -l "$IPA" | grep -q "Payload/.*\.app/" || {
            echo "ERROR: Missing Payload/*.app/ before release"
            exit 1
          }

          rm -rf /tmp/ipa_release_check
          mkdir -p /tmp/ipa_release_check
          unzip -q "$IPA" -d /tmp/ipa_release_check
          APP=$(find /tmp/ipa_release_check/Payload -name "*.app" -type d | head -1)
          if [ -z "$APP" ] || [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: App or Info.plist missing before release"
            exit 1
          fi
          EXEC=$(find "$APP" -type f -perm +111 -maxdepth 1 | head -1 || true)
          if [ -z "$EXEC" ]; then
            EXEC="$APP/WallpaperEngineExporter"
          fi
          if [ ! -f "$EXEC" ]; then
            echo "ERROR: Executable missing before release"
            exit 1
          fi
          file "$EXEC" | grep -qi "Mach-O\|executable" || {
            echo "ERROR: Executable is not Mach-O before release"
            exit 1
          }
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" 2>/dev/null \
            || plutil -extract CFBundleIdentifier raw "$APP/Info.plist" 2>/dev/null \
            || echo "")
          if [ -z "$BID" ]; then
            echo "ERROR: CFBundleIdentifier missing before release"
            exit 1
          fi

          echo "Pre-release checks passed. SHA-256=$SHA Size=$SIZE"
          rm -rf /tmp/ipa_release_check

      - name: Create or update GitHub Release (unsigned CI build)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          IPA=WallpaperEngineExporter.ipa
          TAG="${{ steps.validate.outputs.release_tag }}"
          SHORT_VER="${{ steps.validate.outputs.short_version }}"
          BUILD_VER="${{ steps.validate.outputs.build_version }}"
          IPA_SIZE="${{ steps.validate.outputs.ipa_size_human }}"
          IPA_SHA="${{ steps.validate.outputs.ipa_sha256 }}"
          BUNDLE_ID="${{ steps.validate.outputs.bundle_id }}"
          COMMIT_SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TITLE="v${SHORT_VER} (build ${BUILD_VER}) — Unsigned CI build"

          NOTES=$(cat <<EOF
          ## Wallpaper Engine Exporter — Unsigned CI build

          **This release contains an UNSIGNED IPA** produced by GitHub Actions without Apple code-signing certificates.
          It is intended for CI validation and inspection only. It will **not** install on devices without proper signing.

          | Field | Value |
          |-------|-------|
          | Version | ${SHORT_VER} |
          | Build | ${BUILD_VER} |
          | Tag | \`${TAG}\` |
          | Commit | \`${COMMIT_SHA}\` |
          | Tests | passed |
          | IPA size | ${IPA_SIZE} |
          | SHA-256 | \`${IPA_SHA}\` |
          | Bundle ID | \`${BUNDLE_ID}\` |
          | Signing | **Unsigned** (CODE_SIGNING_ALLOWED=NO) |
          | Workflow | [run](${RUN_URL}) |

          ### Supported wallpaper types

          | Type | Detection | Preview | Export to MP4 |
          |------|-----------|---------|---------------|
          | Video | Yes | Yes | Yes (full) |
          | Scene | Yes | Limited | Embedded video only |
          | Web | Yes | WKWebView | Embedded video only |
          | Application | Yes | No | Embedded video only |

          ### Known limitations

          - iOS cannot access desktop Steam workshop paths.
          - No direct Steam Workshop package download to iOS.
          - Scene / Web / Application wallpapers cannot be fully rendered on iOS.
          - This IPA is **not signed** and cannot be installed on devices without your own Apple Developer credentials.

          ### Asset

          - \`WallpaperEngineExporter.ipa\` — exact IPA validated by CI (same SHA-256 as above)
          EOF
          )

          # Create or update release without failing on existing tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes and replacing IPA asset"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES"
            # Remove existing asset if present, then upload fresh IPA
            if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'WallpaperEngineExporter.ipa'; then
              gh release delete-asset "$TAG" WallpaperEngineExporter.ipa --yes || true
            fi
            gh release upload "$TAG" "$IPA" --clobber
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" "$IPA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi

          echo "Release published:"
          gh release view "$TAG" --json url,tagName,assets -q '{url: .url, tag: .tagName, assets: [.assets[].name]}'
