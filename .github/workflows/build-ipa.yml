name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete project.pbxproj
        run: |
          set -euo pipefail
          python3 scripts/generate-pbxproj.py
          BYTES=$(wc -c < WallpaperEngineExporter.xcodeproj/project.pbxproj | tr -d ' ')
          LINES=$(wc -l < WallpaperEngineExporter.xcodeproj/project.pbxproj | tr -d ' ')
          echo "project.pbxproj: $BYTES bytes, $LINES lines"
          test "$BYTES" -gt 20000
          test "$LINES" -gt 400
          grep -q "PBXNativeTarget" WallpaperEngineExporter.xcodeproj/project.pbxproj
          grep -q "SteamLoginWebView" WallpaperEngineExporter.xcodeproj/project.pbxproj
          grep -q 'DEVELOPMENT_TEAM = ""' WallpaperEngineExporter.xcodeproj/project.pbxproj
          xcodebuild -list -project WallpaperEngineExporter.xcodeproj

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes and targets
        run: |
          xcodebuild -list -project WallpaperEngineExporter.xcodeproj

      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          DEST=""
          for n in "iPhone 16" "iPhone 15" "iPhone 14" "iPhone SE (3rd generation)"; do
            if xcrun simctl list devices available 2>/dev/null | grep -F "$n (" >/dev/null; then
              DEST="platform=iOS Simulator,name=$n"
              break
            fi
          done
          if [ -z "$DEST" ]; then
            echo "ERROR: No iPhone simulator available"
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "Using destination: $DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Build for testing (simulator)
        run: |
          set -euo pipefail
          xcodebuild \
            -project WallpaperEngineExporter.xcodeproj \
            -scheme WallpaperEngineExporter \
            -destination '${{ steps.sim.outputs.dest }}' \
            -configuration Debug \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        id: tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project WallpaperEngineExporter.xcodeproj \
            -scheme WallpaperEngineExporter \
            -destination '${{ steps.sim.outputs.dest }}' \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned device – real iOS arm64)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project WallpaperEngineExporter.xcodeproj \
            -scheme WallpaperEngineExporter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WallpaperEngineExporter.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Locate real .app, validate arm64, package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/WallpaperEngineExporter.xcarchive/Products/Applications/WallpaperEngineExporter.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Real device .app not found at $APP_PATH"
            echo "Archive contents:"
            find build -type d -name "*.app" 2>/dev/null || true
            find build -type d 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "Found real application: $APP_PATH"
          ls -la "$APP_PATH"

          EXECUTABLE="$APP_PATH/WallpaperEngineExporter"
          if [ ! -f "$EXECUTABLE" ]; then
            EXECUTABLE=$(find "$APP_PATH" -type f -perm +111 -maxdepth 1 | head -1 || true)
          fi
          if [ -z "$EXECUTABLE" ] || [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: No executable found inside the .app"
            find "$APP_PATH" -maxdepth 2 -type f
            exit 1
          fi
          echo "Executable: $EXECUTABLE"
          file "$EXECUTABLE"

          FILE_INFO=$(file "$EXECUTABLE")
          echo "$FILE_INFO"
          if echo "$FILE_INFO" | grep -qi 'simulator'; then
            echo "ERROR: Executable is a simulator binary — refusing to package as device IPA"
            exit 1
          fi
          if ! echo "$FILE_INFO" | grep -q 'arm64'; then
            echo "ERROR: Executable is not arm64 — refusing to package"
            exit 1
          fi

          test -x "$EXECUTABLE" || chmod +x "$EXECUTABLE"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist" 2>/dev/null || true)
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "ERROR: Could not read CFBundleIdentifier"
            exit 1
          fi
          echo "Bundle ID: $BUNDLE_ID"

          SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "1.0.0")
          BUILD_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo "0")
          echo "Version: $SHORT_VER ($BUILD_VER)"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          rm -f WallpaperEngineExporter.ipa
          zip -r WallpaperEngineExporter.ipa Payload
          cd ..

          IPA="$PWD/build/WallpaperEngineExporter.ipa"
          test -f "$IPA"
          IPA_SIZE=$(du -h "$IPA" | awk '{print $1}')
          IPA_SHA=$(shasum -a 256 "$IPA" | awk '{print $1}')
          echo "IPA: $IPA ($IPA_SIZE)"
          echo "SHA-256: $IPA_SHA"

          rm -rf build/ipa_check
          mkdir -p build/ipa_check
          unzip -q "$IPA" -d build/ipa_check
          IPA_EXEC=$(find build/ipa_check/Payload -type f -name WallpaperEngineExporter | head -1)
          test -f "$IPA_EXEC"
          IPA_FILE=$(file "$IPA_EXEC")
          echo "IPA executable: $IPA_FILE"
          if echo "$IPA_FILE" | grep -qi simulator; then
            echo "ERROR: IPA contains simulator binary"
            exit 1
          fi
          if ! echo "$IPA_FILE" | grep -q arm64; then
            echo "ERROR: IPA executable is not arm64"
            exit 1
          fi

          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "IPA_SIZE=$IPA_SIZE" >> "$GITHUB_ENV"
          echo "IPA_SHA=$IPA_SHA" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "SHORT_VER=$SHORT_VER" >> "$GITHUB_ENV"
          echo "BUILD_VER=$BUILD_VER" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEngineExporter-ipa
          path: build/WallpaperEngineExporter.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          IPA="${IPA_PATH:-build/WallpaperEngineExporter.ipa}"
          test -f "$IPA"

          SHORT_VER="${SHORT_VER:-1.0.0}"
          BUILD_VER="${BUILD_VER:-0}"
          TAG="v${SHORT_VER}-b${BUILD_VER}"
          TITLE="Wallpaper Engine Exporter ${SHORT_VER} (build ${BUILD_VER})"
          COMMIT_SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          NOTES=$(cat <<ENDNOTES
          ## Wallpaper Engine Exporter ${SHORT_VER} (build ${BUILD_VER})

          Automated CI build. This IPA is **unsigned** and is intended for CI validation and inspection only. It will **not** install on devices without proper signing.

          | Field | Value |
          |-------|-------|
          | Version | ${SHORT_VER} |
          | Build | ${BUILD_VER} |
          | Tag | \`${TAG}\` |
          | Commit | \`${COMMIT_SHA}\` |
          | Tests | ${{ steps.tests.outputs.status }} |
          | IPA size | ${IPA_SIZE} |
          | SHA-256 | \`${IPA_SHA}\` |
          | Bundle ID | \`${BUNDLE_ID}\` |
          | Architecture | **arm64 device** (strict validation) |
          | Signing | **Unsigned** (CODE_SIGNING_ALLOWED=NO) |
          | Workflow | [run](${RUN_URL}) |

          ### Steam auth (build 18)

          Dual-path OpenID: ASWebAuthenticationSession + WKWebView intercept of the HTTPS return_to callback.

          ### Asset

          - \`WallpaperEngineExporter.ipa\` — real iOS arm64 app, validated by CI
          ENDNOTES
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes and replacing IPA asset"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES"
            if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'WallpaperEngineExporter.ipa'; then
              gh release delete-asset "$TAG" WallpaperEngineExporter.ipa --yes || true
            fi
            gh release upload "$TAG" "$IPA" --clobber
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" "$IPA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi

          echo "Release published:"
          gh release view "$TAG" --json url,tagName,assets -q '{url: .url, tag: .tagName, assets: [.assets[].name]}'
