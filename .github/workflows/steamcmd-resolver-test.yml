name: SteamCMD Resolver Test

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/steamcmd-resolver-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build resolver image
        run: docker build -t lumaforge-steamcmd ./server

      - name: Start resolver
        run: |
          docker run -d --name lumaforge-steamcmd             -p 8080:8080             -e PUBLIC_BASE_URL=http://127.0.0.1:8080             lumaforge-steamcmd
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs lumaforge-steamcmd
          exit 1

      - name: Download real Workshop item through SteamCMD
        run: |
          curl --fail --show-error --location             "http://127.0.0.1:8080/workshop?id=3547355412"             -o resolver.json
          cat resolver.json
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          data = json.load(open("resolver.json"))
          assert data.get("provider") == "steamcmd"
          assert data.get("download_url")
          assert urlparse(data["download_url"]).path.startswith("/files/")
          PY

      - name: Fetch generated package
        run: |
          URL=$(python3 -c 'import json; print(json.load(open("resolver.json"))["download_url"])')
          curl --fail --show-error --location "$URL" -o workshop-package
          test -s workshop-package
          file workshop-package
          ls -lh workshop-package

      - name: Show resolver logs on failure
        if: failure()
        run: docker logs lumaforge-steamcmd || true
