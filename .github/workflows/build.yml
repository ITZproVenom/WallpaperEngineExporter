name: LumaDeck CI
on:
  push:
    branches: [main, clean-rebuild]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project LumaDeck.xcodeproj -scheme LumaDeck -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build