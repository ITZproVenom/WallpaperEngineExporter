name: LumaForge CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Pick a simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          # Device names change between Xcode releases, so resolve one at runtime
          # instead of hardcoding a model that may not exist on the runner.
          UDID="$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for device in entries:
                  if not device.get('isAvailable'):
                      continue
                  name = device.get('name', '')
                  if 'iPhone' in name:
                      best = best or device['udid']
          print(best or '')
          ")"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project LumaForge.xcodeproj \
            -scheme LumaForge \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build archive
        run: |
          xcodebuild -project LumaForge.xcodeproj -scheme LumaForge \
            -sdk iphoneos -configuration Release \
            -archivePath build/LumaForge.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/LumaForge.xcarchive/Products/Applications/LumaForge.app build/Payload/
          APP=build/Payload/LumaForge.app
          test -f "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -x "$APP/LumaForge"
          test "$(stat -f%z "$APP/LumaForge")" -gt 100000
          # Photos usage string is required or the export flow crashes on save.
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          cd build
          zip -qry LumaForge-unsigned.ipa Payload
          unzip -t LumaForge-unsigned.ipa >/dev/null
          test -s LumaForge-unsigned.ipa
          shasum -a 256 LumaForge-unsigned.ipa | tee LumaForge-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LumaForge-unsigned-ipa
          path: |
            build/LumaForge-unsigned.ipa
            build/LumaForge-unsigned.ipa.sha256
          if-no-files-found: error

  pipeline:
    name: Processing pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Compile check
        run: |
          python3 -m py_compile server/lumaforge-server.py server/lumaforge_cli.py
          python3 -m compileall -q server/processing server/acquisition

      - name: Run unit tests
        run: python3 -m unittest discover -s server -p 'test_*.py' -v

      - name: Acquisition capability report
        run: python3 server/lumaforge_cli.py capabilities

      - name: End-to-end lossless export
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          # Build a real MP4, wrap it in a real TEX inside a real PKG, then
          # export it through the full pipeline and require byte equality.
          python3 - "$WORK" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "server")
          from tests.build_fixtures import make_mp4, make_pkg, make_tex

          work = Path(sys.argv[1])
          inbox = work / "inbox"
          inbox.mkdir(parents=True, exist_ok=True)
          original = make_mp4(work / "original.mp4", seconds=2, size="640x360")
          (inbox / "3807719502.pkg").write_bytes(
              make_pkg([
                  ("materials/video.tex", make_tex(original, 640, 360)),
                  ("project.json", b'{"type":"video"}'),
              ])
          )
          print("fixture bytes:", len(original))
          PY
          LUMAFORGE_INBOX="$WORK/inbox" python3 server/lumaforge_cli.py \
            run 3807719502 -o "$WORK/export.mp4" | tee "$WORK/result.json"
          python3 -c "
          import json, sys
          result = json.load(open(sys.argv[1]))
          assert result['strategy'] == 'passthrough', result
          assert result['fidelity'] == 'identical', result
          assert result['reencoded'] is False, result
          " "$WORK/result.json"
          cmp "$WORK/original.mp4" "$WORK/export.mp4"
          echo "Export is byte-identical to the original stream."

      - name: Scene packages fail explicitly, never as a silent still
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          python3 - "$WORK" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "server")
          from tests.build_fixtures import make_pkg, make_tex

          work = Path(sys.argv[1])
          (work / "scene.pkg").write_bytes(
              make_pkg([
                  ("scene.json", b'{"objects":[]}'),
                  ("materials/t.tex", make_tex(b"\x07" * 4096, 512, 512)),
              ])
          )
          PY
          OUTPUT="$(python3 server/lumaforge_cli.py inspect "$WORK/scene.pkg")"
          echo "$OUTPUT"
          python3 -c "
          import json, sys
          plan = json.loads(sys.stdin.read())
          assert plan['strategy'] == 'render_scene', plan
          assert plan['needs_renderer'] is True, plan
          assert plan['lossless'] is False, plan
          " <<<"$OUTPUT"

      - name: Worker image builds
        run: docker build -t lumaforge-worker:test .

      - name: On-device processing is present
        shell: bash
        run: |
          set -euo pipefail
          # The app must carry its own pipeline: acquisition may be swapped, but
          # inspection and lossless export have to work with no server at all.
          test -f LumaForge/Processing/PkgArchive.swift
          test -f LumaForge/Processing/TexTexture.swift
          test -f LumaForge/Processing/PackageInspector.swift
          test -f LumaForge/Processing/ExportPipeline.swift
          grep -q "PkgArchive" LumaForge/Processing/PackageInspector.swift
          grep -q "AVAssetWriter" LumaForge/Processing/ExportPipeline.swift
          # Processing must not reach into acquisition, or the split is fiction.
          ! grep -rn "SteamMetadataService\|AcquisitionRegistry\|WorkerSource" \
              LumaForge/Processing/
          # No dead worker URL may remain anywhere in the shipped app.
          ! grep -rn "lumaforge-worker.onrender.com" LumaForge/ server/ render.yaml

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: LumaForge-unsigned-ipa
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LumaForge ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/LumaForge-unsigned.ipa
            release/LumaForge-unsigned.ipa.sha256
