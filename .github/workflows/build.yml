name: LumaForge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: Build archive
        run: |
          xcodebuild -project LumaForge.xcodeproj -scheme LumaForge -sdk iphoneos -configuration Release -archivePath build/LumaForge.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Build XCTest bundle
        run: |
          xcodebuild build-for-testing -project LumaForge.xcodeproj -scheme LumaForge -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/LumaForge.xcarchive/Products/Applications/LumaForge.app build/Payload/
          test -f build/Payload/LumaForge.app/Info.plist
          test -f build/Payload/LumaForge.app/Assets.car
          test -x build/Payload/LumaForge.app/LumaForge
          test "$(stat -f%z build/Payload/LumaForge.app/LumaForge)" -gt 100000
          cd build
          zip -qry LumaForge-unsigned.ipa Payload
          unzip -t LumaForge-unsigned.ipa >/dev/null
          test -s LumaForge-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LumaForge-unsigned-ipa
          path: build/LumaForge-unsigned.ipa
          if-no-files-found: error

  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server Python
        run: python3 -m py_compile server/lumaforge-server.py
      - name: Run server unit tests
        run: python3 -m unittest discover -s server -p 'test_*.py' -v
      - name: Test job API contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          PORT=18080 WORK_ROOT="$ROOT" WORKSHOP_PROVIDER=invalid python3 server/lumaforge-server.py >"$ROOT/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; rm -rf "$ROOT"' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["ok"] is True; assert x["converter"]=="ffmpeg"'
          CREATE="$(curl -fsS -X POST http://127.0.0.1:18080/v1/jobs -H "Content-Type: application/json" -d '{"workshop_id":"3592237763"}')"
          JOB_ID="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["job_id"])' <<<"$CREATE")"
          test -n "$JOB_ID"
          curl -fsS "http://127.0.0.1:18080/v1/jobs/$JOB_ID" >"$ROOT/job.json"
          python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["job_id"]; assert x["status"] in {"queued","downloading","converting","failed","completed"}' <"$ROOT/job.json"
          CALLBACK="$(curl -fsS -D - -o /dev/null 'http://127.0.0.1:18080/v1/auth/steam/callback?state=ci-test&openid.mode=id_res')"
          grep -i '^Location: lumaforge://steam-callback?state=ci-test&openid.mode=id_res' <<<"$CALLBACK"
          test ! -d .github/workflows/release.yml
          ! grep -R "fswswvhpszebuxnloysy" LumaForge server render.yaml --include='*.swift' --include='*.py' --include='*.yaml' 2>/dev/null
      - name: Build worker image
        run: docker build -t lumaforge-worker:test .
      - name: Verify thin-client boundary
        run: |
          ! grep -R "AVFoundation\|AVAssetExportSession\|PackageInspector" LumaForge LumaForge.xcodeproj --include='*.swift' --include='project.pbxproj'

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for production worker
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${GITHUB_SHA}"
          for _ in $(seq 1 60); do
            HEALTH="$(curl -fsS --max-time 15 https://lumaforge-worker.onrender.com/health || true)"
            if python3 -c 'import json,sys; x=json.loads(sys.argv[1]); assert x["ok"] is True; assert x.get("git_commit")==sys.argv[2]' "$HEALTH" "$EXPECTED_SHA"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production worker did not deploy commit $EXPECTED_SHA"
          exit 1
      - name: Install MP4 validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run real Workshop conversion
        shell: bash
        run: |
          set -euo pipefail
          CREATE="$(curl -fsS --max-time 30 -X POST https://lumaforge-worker.onrender.com/v1/jobs \
            -H 'Content-Type: application/json' \
            -d '{"workshop_id":"3714599577"}')"
          JOB_ID="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["job_id"])' <<<"$CREATE")"
          test -n "$JOB_ID"
          for _ in $(seq 1 540); do
            BODY="$(curl -fsS --max-time 30 "https://lumaforge-worker.onrender.com/v1/jobs/$JOB_ID")"
            STATUS="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["status"])' <<<"$BODY")"
            case "$STATUS" in
              completed)
                FILENAME="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["filename"])' <<<"$BODY")"
                FILE_URL="https://lumaforge-worker.onrender.com/v1/files/$FILENAME"
                FETCHED=0
                for _ in $(seq 1 5); do
                  if curl -fsS --max-time 180 -o "$RUNNER_TEMP/lumaforge-smoke.mp4" "$FILE_URL"; then
                    FETCHED=1
                    break
                  fi
                  sleep 2
                done
                if [ "$FETCHED" -ne 1 ]; then
                  echo "Final MP4 fetch failed: $FILE_URL"
                  echo "$BODY"
                  curl -sS -i --max-time 30 "$FILE_URL" || true
                  exit 1
                fi
                test -s "$RUNNER_TEMP/lumaforge-smoke.mp4"
                python3 -c 'from pathlib import Path; p=Path(__import__("sys").argv[1]); d=p.read_bytes(); assert len(d)>1024; assert d[4:8]==b"ftyp"; assert b"mp4" in d[:64]' "$RUNNER_TEMP/lumaforge-smoke.mp4"
                curl -fsS -X DELETE "https://lumaforge-worker.onrender.com/v1/jobs/$JOB_ID" >/dev/null || true
                exit 0
                ;;
              failed)
                echo "$BODY"
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "Production Workshop conversion timed out"
          exit 1

      - name: Run real scene Workshop conversion
        shell: bash
        run: |
          set -euo pipefail
          CREATE="$(curl -fsS --max-time 30 -X POST https://lumaforge-worker.onrender.com/v1/jobs \
            -H 'Content-Type: application/json' \
            -d '{"workshop_id":"3714599577"}')"
          JOB_ID="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["job_id"])' <<<"$CREATE")"
          test -n "$JOB_ID"
          for _ in $(seq 1 840); do
            BODY="$(curl -fsS --max-time 30 "https://lumaforge-worker.onrender.com/v1/jobs/$JOB_ID")"
            STATUS="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["status"])' <<<"$BODY")"
            case "$STATUS" in
              completed)
                FILENAME="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["filename"])' <<<"$BODY")"
                FILE_URL="https://lumaforge-worker.onrender.com/v1/files/$FILENAME"
                curl -fsS --max-time 180 -o "$RUNNER_TEMP/lumaforge-scene-smoke.mp4" "$FILE_URL"
                test -s "$RUNNER_TEMP/lumaforge-scene-smoke.mp4"
                python3 -c 'from pathlib import Path; p=Path(__import__("sys").argv[1]); d=p.read_bytes(); assert len(d)>1024; assert d[4:8]==b"ftyp"; assert b"mp4" in d[:64]' "$RUNNER_TEMP/lumaforge-scene-smoke.mp4"
                curl -fsS -X DELETE "https://lumaforge-worker.onrender.com/v1/jobs/$JOB_ID" >/dev/null || true
                exit 0
                ;;
              failed)
                echo "$BODY"
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "Production scene Workshop conversion timed out"
          exit 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, server-check, live-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: LumaForge-unsigned-ipa
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumaforge-build-${{ github.run_number }}
          name: LumaForge Build ${{ github.run_number }}
          generate_release_notes: true
          files: release/LumaForge-unsigned.ipa
