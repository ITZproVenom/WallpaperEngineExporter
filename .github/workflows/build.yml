name: LumaForge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - name: Build archive
        run: |
          xcodebuild -project LumaForge.xcodeproj -scheme LumaForge -sdk iphoneos -configuration Release -archivePath build/LumaForge.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/LumaForge.xcarchive/Products/Applications/LumaForge.app build/Payload/
          test -f build/Payload/LumaForge.app/Info.plist
          test -f build/Payload/LumaForge.app/Assets.car
          test -x build/Payload/LumaForge.app/LumaForge
          test "$(stat -f%z build/Payload/LumaForge.app/LumaForge)" -gt 100000
          cd build
          zip -qry LumaForge-unsigned.ipa Payload
          unzip -t LumaForge-unsigned.ipa >/dev/null
          test -s LumaForge-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LumaForge-unsigned-ipa
          path: build/LumaForge-unsigned.ipa
          if-no-files-found: error

  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server Python
        run: python3 -m py_compile server/lumaforge-server.py
      - name: Build worker image
        run: docker build -t lumaforge-worker:test .
      - name: Verify thin-client boundary
        run: |
          ! grep -R "AVFoundation\|AVAssetExportSession\|PackageInspector" LumaForge --include='*.swift'

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, server-check]
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: LumaForge-unsigned-ipa
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumaforge-build-${{ github.run_number }}
          name: LumaForge Build ${{ github.run_number }}
          generate_release_notes: true
          files: release/LumaForge-unsigned.ipa
