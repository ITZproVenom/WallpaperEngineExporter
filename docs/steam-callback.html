<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steam sign-in — returning to app</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0b0b0f;
      color: #e8e8ed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #9898a6; font-size: 0.95rem; line-height: 1.4; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 12px 20px;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Returning to Wallpaper Engine Exporter…</h1>
    <p id="status">Completing Steam sign-in.</p>
    <p id="manual" style="display:none">
      If the app does not open automatically, tap the button below.
    </p>
    <a id="open" href="#" style="display:none">Open App</a>
  </div>
  <script>
    (function () {
      var scheme = "wallpaperexporter";
      var path = "steam-callback";
      var qs = window.location.search || "";
      var target = scheme + "://" + path + qs;

      var open = document.getElementById("open");
      var manual = document.getElementById("manual");
      var status = document.getElementById("status");

      open.href = target;

      // Immediate redirect for ASWebAuthenticationSession to intercept
      window.location.replace(target);

      // Fallback UI if the app does not capture the scheme
      setTimeout(function () {
        status.textContent = "Waiting for the app…";
        manual.style.display = "block";
        open.style.display = "inline-block";
      }, 800);
    })();
  </script>
</body>
</html>
