<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steam OpenID return</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0b0b0f; color: #e8e8ed;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
    a { display: inline-block; margin-top: 1rem; padding: 12px 20px; background: #1a73e8; color: #fff;
      text-decoration: none; border-radius: 10px; font-weight: 600; }
  </style>
  <meta http-equiv="refresh" content="0;url=wallpaperexporter://steam-callback" />
</head>
<body>
  <div>
    <p>Completing Steam sign-in…</p>
    <p style="color:#9898a6">If the app does not continue, open it manually.</p>
    <a id="open" href="wallpaperexporter://steam-callback">Open Wallpaper Engine Exporter</a>
  </div>
  <script>
    (function () {
      var target = "wallpaperexporter://steam-callback" + (window.location.search || "");
      document.getElementById("open").href = target;
      try { window.location.replace(target); } catch (e) {}
    })();
  </script>
</body>
</html>
