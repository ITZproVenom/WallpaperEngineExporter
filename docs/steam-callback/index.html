<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumaForge — returning to the app</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #1b2838; color: #e8edf2; padding: 24px; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; color: #b9c4d0; }
  a.button { display: inline-block; margin-top: 1rem; padding: .7rem 1.2rem;
             border-radius: 10px; background: #5b5bd6; color: #fff;
             text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Signing you in…</h1>
  <p>LumaForge should reopen automatically.</p>
  <p id="fallback" hidden>If it did not, tap the button below.</p>
  <a class="button" id="open" href="#" hidden>Open LumaForge</a>
  <p id="error" hidden>This page was opened without Steam sign-in details, so there is
     nothing to return to the app.</p>
</main>
<script>
  // Steam's OpenID response arrives as a query string. Hand it straight back to
  // the app through its custom scheme. Nothing is stored, logged, or sent
  // anywhere: this page exists only so sign-in needs no server.
  (function () {
    var query = window.location.search;
    if (!query || query.length < 2) {
      document.getElementById('error').hidden = false;
      return;
    }
    var target = 'lumaforge://steam-callback' + query;
    var button = document.getElementById('open');
    button.href = target;
    button.hidden = false;
    document.getElementById('fallback').hidden = false;
    window.location.replace(target);
  })();
</script>
</body>
</html>
